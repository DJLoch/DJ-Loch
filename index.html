<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <title>DJ LOCH</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, #ffffff 0%, #f4f4f4 100%);
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: rgba(255,255,255,0.92);
      border: 1px solid #e6e6e6;
      border-radius: 28px;
      box-shadow: 0 18px 55px rgba(0,0,0,0.08);
      padding: 34px 24px 26px;
      text-align: center;
    }
    .logo {
      width: 86px;
      height: 86px;
      margin: 0 auto 18px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #111;
      color: #fff;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -1px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.18);
    }
    h1 {
      margin: 0;
      font-size: 34px;
      letter-spacing: 0.02em;
    }
    .tagline {
      margin: 8px 0 26px;
      color: #666;
      font-size: 15px;
    }
    .links {
      display: grid;
      gap: 14px;
    }
    a.button {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 58px;
      padding: 14px 18px;
      border-radius: 16px;
      text-decoration: none;
      font-size: 17px;
      font-weight: 750;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    a.button:active { transform: scale(0.985); }
    .venmo {
      background: #111;
      color: #fff;
      box-shadow: 0 8px 20px rgba(0,0,0,0.14);
    }
    .instagram {
      background: #fff;
      color: #111;
      border: 1px solid #dcdcdc;
    }
    .handle {
      margin-top: 6px;
      font-size: 12px;
      opacity: 0.75;
      font-weight: 600;
    }
    footer {
      margin-top: 24px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">DL</div>
    <h1>DJ LOCH</h1>
    <p class="tagline">Tips, socials, and more.</p>

    <div class="links">
      <a class="button venmo" href="https://www.venmo.com/u/DJLoch" target="_blank" rel="noopener noreferrer">
        <div>
          💸 TIP DJ LOCH — VENMO
          <div class="handle">@DJLoch</div>
        </div>
      </a>

      <a class="button instagram" href="https://www.instagram.com/itsdjloch?stkn=MXI4YjhxZzd2Z3V2dw%3D%3D&utm_source=qr" target="_blank" rel="noopener noreferrer">
        <div>
          📸 FOLLOW ON INSTAGRAM
          <div class="handle">@itsdjloch</div>
        </div>
      </a>
    </div>

    <footer>DJ LOCH</footer>
  </main>
</body>
</html>
